<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Queeres Archiv Hamburg</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO -->

<section id="intro">

    <div class="intro-message">

        <div class="intro-line">
            
          QUEERE GESCHICHTE IST TEIL DIESER STADT
        </div>

        <div class="intro-subline">
            Nicht alle Geschichten bleiben sichtbar. 
            VESTIGE lädt dazu ein, den Spuren queeren Lebens in Hamburg zu folgen 
            und den Geschichten dahinter zu begegnen.
    
        </div>

    </div>

</section>

<!-- REGISTERBLATT -->
 

<section id="archive">

    <div id="archive-info">

        <div class="archive-title">
            
          vestige
        </div>

        <div class="archive-action">
            
         Archiv queerer Geschichte in Hamburg
        </div>

    </div>

   <div id="mirror-animation">

    <img src="img/Punktanimation1.png" class="mirror-frame active">
    <img src="img/Punktanimation2.png" class="mirror-frame">
    <img src="img/Punktanimation3.png" class="mirror-frame">

</div>
  
    <div id="holes"></div>

    <div id="fragments"></div>

</section>

<!-- OVERLAY -->

<section id="overlay">

    <div id="document">

        <div class="document-inner">

            <div id="large-title"></div>

            <div id="year"></div>    

              <div id="location"></div>

            <article id="story-text"></article>

            <button id="closeBtn">

                ← WEITERE GESCHICHTEN ÖFFNEN

            </button>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
